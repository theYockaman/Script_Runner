<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Script Runner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- prompt chevron drawn as a play triangle: "run" -->
  <path d="M18 17 L38 30 L18 43 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <!-- cursor underscore: "script" -->
  <rect x="42" y="40" width="12" height="5" rx="2.5" fill="#fff"/>
</svg>

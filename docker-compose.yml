services:
  backend:
    build: .
    image: script-runner:latest
    ports:
      - '8005:8080'
    env_file:
      - path: .env
        required: false
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/data.db
      - SCRIPTS_DIR=/app/scripts
  frontend:
    build: ./frontend
    ports:
      - '3015:80'
    depends_on:
      - backend
